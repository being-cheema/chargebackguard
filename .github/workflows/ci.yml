name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend deps
        run: cd backend && npm ci
      - name: Run tests
        run: cd backend && npm test
      - name: Seed dataset
        run: cd backend && npm run seed
      - name: Verify dataset integrity
        run: cd backend && npm run evaluate:integrity
      - name: Evaluate metrics
        run: cd backend && npm run evaluate
